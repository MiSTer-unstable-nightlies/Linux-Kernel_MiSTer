name: CI Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Build
      run: set -o pipefail && curl --fail --location https://raw.githubusercontent.com/MiSTer-unstable-nightlies/Build-Automation_MiSTer/main/build.sh | bash -
      env:
        REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISPATCH_TOKEN: ${{ secrets.BUILD_AUTOMATION_DISPATCH_TOKEN }}
        # Linux 6.5 moved the ARM device trees into per-vendor subdirectories, so this
        # branch builds intel/socfpga/socfpga_cyclone5_de10_nano.dtb. The default command
        # in Build-Automation's repositories.ini still uses the old flat path, which is
        # correct for MiSTer-v5.15 but has no make target here, so override it per-branch.
        # The \& escapes keep the ampersands literal when build.sh seds this into the Dockerfile.
        COMPILATION_COMMAND: >-
          apt-get -y update \&\& apt-get -y install build-essential git libncurses-dev flex bison openssl
          libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf liblz4-tool bc curl gcc
          git libssl-dev libncurses5-dev lzop make u-boot-tools libgmp3-dev libmpc-dev \&\& export
          ARCH=arm \&\& export LOCALVERSION=-MiSTer \&\& export CROSS_COMPILE=arm-none-linux-gnueabihf-
          \&\& make MiSTer_defconfig \&\& make -j2 zImage \&\& make
          intel/socfpga/socfpga_cyclone5_de10_nano.dtb \&\& cat arch/arm/boot/zImage
          arch/arm/boot/dts/intel/socfpga/socfpga_cyclone5_de10_nano.dtb > zImage_dtb
